services:
  postgres:
    image: postgres:16-alpine
    container_name: autosalon-postgres
    environment:
      POSTGRES_DB: autosalon
      POSTGRES_USER: autosalon
      POSTGRES_PASSWORD: autosalon
    ports:
      - "5432:5432"
    volumes:
      - autosalon-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autosalon -d autosalon"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: autosalon_keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ../keycloak:/opt/keycloak/data/import

  autosalon:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: neyas/autosalon:1.0-SNAPSHOT
    container_name: autosalon
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/autosalon
      DB_USERNAME: autosalon
      DB_PASSWORD: autosalon
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/autosalon
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/autosalon/protocol/openid-connect/certs
    ports:
      - "8080:8080"

volumes:
  autosalon-postgres:
